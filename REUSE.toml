# SPDX license metadata for verified ResoArc-authored source, documentation and graphics.
# External fonts, stock photos, screenshot media and generated archives require
# separate rights review. This file alone does NOT assert REUSE compliance.
version = 1

[[annotations]]
path = [
  ".gitattributes",
  ".gitignore",
  "**/.gitignore",
  ".github/workflows/*.yml",
  "**/*.md",
  "**/*.py",
  "**/*.js",
  "**/*.cjs",
  "**/*.mjs",
  "**/*.ps1",
  "**/*.html",
  "**/*.css",
  "**/*.json",
  "**/*.xml",
  "**/*.svg",
  "**/*.sha256",
  "site/llms.txt",
  "REUSE.toml"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 ResoArc Open Technology Project"
SPDX-License-Identifier = "MIT"
