# License coverage for ResoArc-managed public materials.
# Per-file notices take priority; third-party assets are exceptions.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 ResoArc Open Technology Project"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "site/assets/fonts/*.woff2"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2012 Google Inc. All Rights Reserved."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/licenses/NOTOSERIFJP-OFL.txt"
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2012 Google Inc. All Rights Reserved."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "site/assets/hero-architecture.jpg"
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-Unsplash"

