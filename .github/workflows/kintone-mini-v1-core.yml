name: Mini v1 candidate core

on:
  push:
    paths:
      - "experimental/mini-v1-core/**"
      - ".github/workflows/kintone-mini-v1-core.yml"
  pull_request:
    paths:
      - "experimental/mini-v1-core/**"
      - ".github/workflows/kintone-mini-v1-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test all 18 mini feature pure operations and negative cases
        run: npm test --prefix experimental/mini-v1-core
      - name: Check core source syntax
        run: node --check experimental/mini-v1-core/src/core.mjs
