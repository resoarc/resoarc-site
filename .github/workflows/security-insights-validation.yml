# ResoArc Security Slam Cleaner: schema validation on proposed changes.
# Uses immutable GitHub Actions and an immutable OpenSSF CUE schema revision.
name: Validate Security Insights

on:
  pull_request:
    paths:
      - security-insights.yml
      - .github/workflows/security-insights-validation.yml
  push:
    branches: [main]
    paths:
      - security-insights.yml
      - .github/workflows/security-insights-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm Security Insights file is nonempty
        shell: bash
        run: test -s security-insights.yml
      - name: Install pinned CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - name: Fetch verified upstream schema revision
        shell: bash
        run: |
          curl --fail --show-error --silent --location --retry 2 \
            --output /tmp/resoarc-security-insights-schema.cue \
            https://raw.githubusercontent.com/ossf/security-insights/701ac2a02ef17fc8b316f5df685428773c51372a/spec/schema.cue
          test -s /tmp/resoarc-security-insights-schema.cue
      - name: Validate Security Insights using CUE schema
        shell: bash
        run: cue vet -d '#SecurityInsights' /tmp/resoarc-security-insights-schema.cue security-insights.yml
