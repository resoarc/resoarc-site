name: Verify public source
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check source and links
        run: python scripts/verify_site.py
      - name: Validate JavaScript syntax
        run: |
          node --check site/assets/tools/hash.js
          node --check site/assets/tools/csv.js
