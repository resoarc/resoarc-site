# Check public repository licensing with FSFE's official pinned REUSE action.
name: REUSE Specification compliance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6 (signed upstream tag)
