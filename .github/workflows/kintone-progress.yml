name: ResoArc kintone portfolio progress

on:
  push:
    paths:
      - "docs/kintone-progress/**"
      - "scripts/kintone-progress.mjs"
      - "tests/kintone-progress.test.mjs"
      - "tests/kintone-evidence.test.mjs"
      - "scripts/kintone-evidence.mjs"
      - "scripts/check-mini-provenance.mjs"
      - "scripts/kintone-verify-zip-signatures.py"
      - ".github/workflows/kintone-progress.yml"
  pull_request:
    paths:
      - "docs/kintone-progress/**"
      - "scripts/kintone-progress.mjs"
      - "tests/kintone-progress.test.mjs"
      - "tests/kintone-evidence.test.mjs"
      - "scripts/kintone-evidence.mjs"
      - "scripts/check-mini-provenance.mjs"
      - "scripts/kintone-verify-zip-signatures.py"
      - ".github/workflows/kintone-progress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Inventory and release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate 29 records, release gates and dashboard synchronization
        run: node scripts/kintone-progress.mjs --check
      - name: Test invalid release statuses and evidence handling
        run: node --test tests/kintone-progress.test.mjs
      - name: Verify unit and static preflight evidence
        run: node scripts/kintone-evidence.mjs
      - name: Verify eleven original signed ZIP bytes (RSA/SHA-1 legacy)
        run: python scripts/kintone-verify-zip-signatures.py
      - name: Validate recovered 18 mini source and signer pins
        run: node scripts/check-mini-provenance.mjs
      - name: Test corrupted evidence is rejected
        run: node --test tests/kintone-evidence.test.mjs
      - name: Report aggregate progress
        run: node scripts/kintone-progress.mjs --summary
