name: ResoArc Sheet RC1 isolated CI
on:
  push:
    branches: ['qa/sheet-v1.0.0-rc.1-ci-20261118']
    paths:
      - 'apps/sheet/rc1-src/**'
      - '.github/workflows/sheet-rc1-ci.yml'
      - 'REUSE.toml'
  pull_request:
    paths:
      - 'apps/sheet/rc1-src/**'
      - '.github/workflows/sheet-rc1-ci.yml'
      - 'REUSE.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Clean dependency install
        working-directory: apps/sheet/rc1-src
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        working-directory: apps/sheet/rc1-src
        run: npm test
      - name: Production build
        working-directory: apps/sheet/rc1-src
        run: npm run build
