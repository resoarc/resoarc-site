name: REUSE 3.3 licensing
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned REUSE tool
        run: python -m pip install 'reuse[charset-normalizer]==6.2.0'
      - name: Verify all project files (fail on missing or invalid licenses)
        id: lint
        run: |
          python scripts/reuse_release_gate.py --report "$RUNNER_TEMP/reuse-audit.json"
      - name: Create public machine-readable audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reuse-lint-${{ github.sha }}
          path: ${{ runner.temp }}/reuse-audit.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summarize result and failure reason
        if: always()
        env:
          AUDIT_REPORT: ${{ runner.temp }}/reuse-audit.json
        run: |
          python - <<'PY'
          import os,json,pathlib
          p=pathlib.Path(os.environ["AUDIT_REPORT"])
          d=json.loads(p.read_text()) if p.exists() else {"status":"error","cause":"report_missing"}
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf8") as f:
              f.write("# REUSE 3.3 verification\n\n")
              for k in ("status","cause","target_commit","checked_at_utc","spec_version"):
                  f.write(f"- {k}: `{d.get(k,'n/a')}`\n")
              if d.get("status")!="pass":
                  f.write("\n## Failure details\n\n```json\n")
                  f.write(json.dumps({k:d.get("details",{}).get(k) for k in ("summary","non_compliant","recommendations")},ensure_ascii=False,indent=2)[:14000])
                  f.write("\n```\n")
          PY
      - name: Verify pinned signatures and archive notices
        run: python scripts/check_signed_archive_notice.py
