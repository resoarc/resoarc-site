# Security Slam 2026 Mechanizer candidate; published to the default branch.
# This workflow has NOT completed a scan until a repository-scoped, read-only
# PVTR_GITHUB_TOKEN secret is configured and a real run produces evidence.
# An empty or unauthenticated assessment must never be represented as PASS.
name: OSPS Baseline recurring assessment

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osps-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Evaluate OSPS Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify scanner authentication is configured
        shell: bash
        env:
          PVTR_TOKEN: ${{ secrets.PVTR_GITHUB_TOKEN }}
        run: |
          if [ -z "$PVTR_TOKEN" ]; then
            echo "::error::Required read-only PVTR_GITHUB_TOKEN secret is missing. No scan was performed."
            exit 1
          fi

      - name: Checkout source (immutable action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate public repository with OSPS scanner
        uses: revanite-io/osps-baseline-action@d0d850b592f1788b2631f1dfdf84d80ea8c720f5 # v1.5.3
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          token: ${{ secrets.PVTR_GITHUB_TOKEN }}
          catalog: osps-baseline
          output-format: json
          upload-sarif: 'false'
          fail-on-error: 'false'

      - name: Require nonempty scanner evidence
        shell: bash
        run: |
          if ! test -d evaluation_results; then
            echo "::error::Scanner did not create evaluation_results."
            exit 1
          fi
          if ! find evaluation_results -type f -size +0c -print -quit | grep -q .; then
            echo "::error::Scanner returned no nonempty report files."
            exit 1
          fi

      - name: Archive scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osps-baseline-${{ github.run_number }}
          path: evaluation_results/
          if-no-files-found: error
          retention-days: 30
