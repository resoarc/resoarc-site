name: TrapNet Guardian Release Candidate Gates

on:
  push:
    branches: [main]
    paths:
      - 'experiments/trapnet-zero-trust/**'
      - '.github/workflows/trapnet-guardian-release-gates.yml'
  pull_request:
    paths:
      - 'experiments/trapnet-zero-trust/**'
      - '.github/workflows/trapnet-guardian-release-gates.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guardian-candidate-only:
    name: Guardian CLI acceptance and UNSIGNED candidate checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/trapnet-zero-trust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experiments/trapnet-zero-trust/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-parity and release gate unit tests
        run: python3 -m unittest discover -s release -p 'test_*.py' -v
      - name: Test non-privileged Linux install and guarded removal
        run: sh release/test_install_linux.sh
      - name: Run actual Guardian signed-feed / rollback / invalid-input acceptance
        run: python3 release/guardian_beta_acceptance.py --source . --output guardian-candidate-acceptance.json
      - name: Install Linux native syscall tracer (required, no silent skip)
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends strace
          fi
          command -v strace
      - name: Audit real Guardian Linux process against network and secondary exec
        run: python3 release/guardian_native_syscall_audit.py --source . --output guardian-native-syscall-audit.json
      - name: Exercise offline Root-signed signer revocation and beta-mode enforcement
        run: python3 release/guardian_root_acceptance.py --source . --output guardian-root-acceptance-linux.json
      - name: Test independent release signing and verification (synthetic only)
        run: python3 release/release_signature_acceptance.py --source . --output release-signature-linux.json
      - name: Build Windows/Linux/ARM64 UNSIGNED candidate in runner only
        run: python3 release/guardian_candidate_package.py --source . --out ./guardian-ci-build
      - name: Assert unapproved release evidence cannot receive GO
        shell: bash
        run: |
          echo '{"checks":{}}' > ./test-unapproved-evidence.json
          set +e
          python3 release/release_gate.py --evidence ./test-unapproved-evidence.json > ./release-gate-result.json
          result=$?
          set -e
          test "$result" -eq 3
          grep -q '"ready_for_human_decision": false' ./release-gate-result.json
          grep -q '"publication_executed": false' ./release-gate-result.json
      - name: Upload reports and hashes only (NO binaries, keys or release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trapnet-guardian-public-beta-gate-evidence
          path: |
            experiments/trapnet-zero-trust/guardian-candidate-acceptance.json
            experiments/trapnet-zero-trust/guardian-native-syscall-audit.json
            experiments/trapnet-zero-trust/guardian-root-acceptance-linux.json
            experiments/trapnet-zero-trust/release-signature-linux.json
            experiments/trapnet-zero-trust/guardian-ci-build/manifest.json
            experiments/trapnet-zero-trust/guardian-ci-build/ZIP_SHA256.txt
            experiments/trapnet-zero-trust/release-gate-result.json
          if-no-files-found: warn
          retention-days: 30

  guardian-windows-runtime:
    name: Windows Guardian real CLI acceptance (no install)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/trapnet-zero-trust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experiments/trapnet-zero-trust/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise native Windows Guardian executable with temporary test keys
        shell: pwsh
        run: python release/guardian_beta_acceptance.py --source . --output guardian-windows-acceptance.json
      - name: Exercise Root policy signer rotation on native Windows
        shell: pwsh
        run: python release/guardian_root_acceptance.py --source . --output guardian-root-acceptance-windows.json
      - name: Verify synthetic publisher signatures on Windows
        shell: pwsh
        run: python release/release_signature_acceptance.py --source . --output release-signature-windows.json
      - name: Test Windows per-user install and guarded removal
        shell: pwsh
        run: ./release/test_install_windows.ps1
      - name: Retain key-free Windows acceptance result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trapnet-guardian-windows-acceptance
          path: |
            experiments/trapnet-zero-trust/guardian-windows-acceptance.json
            experiments/trapnet-zero-trust/guardian-root-acceptance-windows.json
            experiments/trapnet-zero-trust/release-signature-windows.json
          if-no-files-found: warn
          retention-days: 30

  guardian-linux-arm64-native:
    name: ARM64 native Guardian Root/STOP/install and syscall acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/trapnet-zero-trust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: experiments/trapnet-zero-trust/go.mod
          cache: false
      - name: Prove native ARM64 runner, never emulated cross-build
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          test "$(go env GOARCH)" = arm64
      - name: Native ARM64 signed Guardian CLI, STOP and antirollback
        run: python3 release/guardian_beta_acceptance.py --source . --output guardian-arm64-acceptance.json
      - name: Native ARM64 Root signer rotation and revocation
        run: python3 release/guardian_root_acceptance.py --source . --output guardian-root-acceptance-arm64.json
      - name: Native ARM64 per-user installation and guarded removal
        run: sh release/test_install_linux.sh
      - name: Prepare native ARM64 syscall tracer, required
        shell: bash
        run: |
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends strace
          fi
          command -v strace
      - name: Native ARM64 zero-egress and inert signed text syscall audit
        run: python3 release/guardian_native_syscall_audit.py --source . --output guardian-arm64-syscall-audit.json
      - name: Upload only key-free native ARM64 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trapnet-guardian-arm64-native-acceptance
          path: |
            experiments/trapnet-zero-trust/guardian-arm64-acceptance.json
            experiments/trapnet-zero-trust/guardian-root-acceptance-arm64.json
            experiments/trapnet-zero-trust/guardian-arm64-syscall-audit.json
          if-no-files-found: warn
          retention-days: 30
