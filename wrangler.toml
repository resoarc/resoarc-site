# Cloudflare Pages production settings sourced from dashboard on 2026-11-08.
name = "resoarc"
pages_build_output_dir = "site"
compatibility_date = "2026-10-15"

# Default / preview bindings
[[services]]
binding = "SWWW_LIVE"
service = "resoarc-swww-live-edge"
environment = ""

[[d1_databases]]
binding = "DOWNLOAD_DB"
database_name = "resoarc-download-metrics"
database_id = "a2c02dcd-0dc0-45d2-bae8-2250fe7a68bc"

# Wrangler environments do not inherit non-inheritable bindings.
[env.production]
[[env.production.services]]
binding = "SWWW_LIVE"
service = "resoarc-swww-live-edge"
environment = ""

[[env.production.d1_databases]]
binding = "DOWNLOAD_DB"
database_name = "resoarc-download-metrics"
database_id = "a2c02dcd-0dc0-45d2-bae8-2250fe7a68bc"
